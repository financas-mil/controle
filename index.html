<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230b1326'/><stop offset='100%' stop-color='%23101c36'/></linearGradient><linearGradient id='neon' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2300f0ff'/><stop offset='100%' stop-color='%237c3aed'/></linearGradient></defs><rect width='512' height='512' rx='110' fill='url(%23bg)'/><path d='M140 120h232v60H204v70h148v60H204v102h-64V120z' fill='url(%23neon)'/></svg>">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANÇAS MIL - Entrar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-body: radial-gradient(circle at top right, #0d1b2a, #050811);
            --card-bg: #0b1326;
            --card-border: rgba(0, 240, 255, 0.15);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --gray-soft: #131c31;
            
            --azul-marca: #00b4d8;
            --azul-neon: #00f0ff;
            --azul-neon-glow: 0 0 15px rgba(0, 240, 255, 0.4);
            --roxo-botao-novo: #7c3aed;
            
            --red-main: #ef4444;
            --red-soft: rgba(239, 68, 68, 0.15);
            
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-modal: 0 25px 35px -5px rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { 
            background: var(--bg-body); 
            background-attachment: fixed; 
            color: var(--text-main); 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: var(--shadow-modal);
            position: relative;
        }

        .brand-wrapper-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-premium-icon {
            position: relative; width: 54px; height: 54px;
            background: linear-gradient(135deg, #050b14 0%, #101c36 100%);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--card-border); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            margin-bottom: 12px;
        }
        .logo-premium-icon .icon-base { color: var(--azul-neon); font-size: 22px; position: relative; z-index: 2; text-shadow: 0 0 10px var(--azul-neon); }
        .logo-premium-icon::before { content: ''; position: absolute; inset: -2px; background: linear-gradient(135deg, var(--azul-neon), var(--roxo-botao-novo)); border-radius: 18px; z-index: 1; opacity: 0.7; }
        
        .logo-premium-text { font-size: 26px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .badge-mil { background: linear-gradient(135deg, var(--azul-marca) 0%, var(--roxo-botao-novo) 100%); color: #ffffff; font-size: 12px; font-weight: 800; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 10px rgba(124, 58, 237, 0.4); }
        .auth-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--gray-soft);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
        }

        .auth-tab-btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: none;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .auth-tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 180, 216, 0.25) 0%, rgba(124, 58, 237, 0.25) 100%);
            color: var(--azul-neon);
            border: 1px solid var(--azul-marca);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.15);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--azul-marca);
            font-size: 14px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            color: var(--text-main);
            background-color: var(--gray-soft);
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: var(--azul-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--azul-marca) 0%, var(--roxo-botao-novo) 100%);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.3);
            transition: 0.2s;
            margin-top: 6px;
        }

        .auth-submit-btn:hover {
            background: linear-gradient(135deg, var(--azul-neon) 0%, var(--roxo-botao-novo) 100%);
            box-shadow: var(--azul-neon-glow);
            transform: translateY(-1px);
        }

        .error-message {
            background-color: var(--red-soft);
            color: var(--red-main);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .success-message {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .auth-form-panel { display: none; }
        .auth-form-panel.active { display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-wrapper-center">
            <div class="logo-premium-icon">
                <i class="fa-solid fa-chart-line icon-base"></i>
            </div>
            <div class="logo-premium-text">
                <span>Finanças</span>
                <span class="badge-mil">Mil</span>
            </div>
            <p class="auth-subtitle">Estratégia & Inteligência Patrimonial</p>
        </div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="alternarModoAuth('login')">Entrar</button>
            <button type="button" class="auth-tab-btn" id="tab-cadastro-btn" onclick="alternarModoAuth('cadastro')">Criar Conta</button>
        </div>

        <div id="alerta-erro" class="error-message"></div>
        <div id="alerta-sucesso" class="success-message"></div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="form-login" class="auth-form-panel active" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="login-email" class="auth-input" placeholder="seu@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="login-senha" class="auth-input" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="auth-submit-btn" id="btn-entrar">Acessar Painel</button>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="form-cadastro" class="auth-form-panel" onsubmit="fazerCadastro(event)">
            <div class="form-group">
                <label>Nome Completo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="cad-nome" class="auth-input" placeholder="Seu Nome" required>
                </div>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="cad-email" class="auth-input" placeholder="seu@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="cad-senha" class="auth-input" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>
            <button type="submit" class="auth-submit-btn" id="btn-cadastrar">Cadastrar e Entrar</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ztjrjtplgwffsofhtone.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-Y2ysHQmhUbhh2J-T8W-7A_hgLd-YYV';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = "painel.html";
            }
        });

        function alternarModoAuth(modo) {
            document.getElementById('alerta-erro').style.display = 'none';
            document.getElementById('alerta-sucesso').style.display = 'none';

            const btnLogin = document.getElementById('tab-login-btn');
            const btnCadastro = document.getElementById('tab-cadastro-btn');
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');

            if (modo === 'login') {
                btnLogin.classList.add('active');
                btnCadastro.classList.remove('active');
                formLogin.classList.add('active');
                formCadastro.classList.remove('active');
            } else {
                btnCadastro.classList.add('active');
                btnLogin.classList.remove('active');
                formCadastro.classList.add('active');
                formLogin.classList.remove('active');
            }
        }

        function mostrarErro(msg) {
            const el = document.getElementById('alerta-erro');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('alerta-sucesso').style.display = 'none';
        }

        function mostrarSucesso(msg) {
            const el = document.getElementById('alerta-sucesso');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('alerta-erro').style.display = 'none';
        }

        async function fazerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;

            const btn = document.getElementById('btn-entrar');
            btn.innerText = 'Entrando...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, senha });

            if (error) {
                mostrarErro(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message);
                btn.innerText = 'Acessar Painel';
                btn.disabled = false;
            } else {
                window.location.href = "painel.html";
            }
        }

        async function fazerCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value;

            const btn = document.getElementById('btn-cadastrar');
            btn.innerText = 'Cadastrando...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                senha,
                options: { data: { nome } }
            });

            if (error) {
                mostrarErro(error.message);
                btn.innerText = 'Cadastrar e Entrar';
                btn.disabled = false;
            } else {
                mostrarSucesso('Conta criada com sucesso! Redirecionando...');
                setTimeout(() => {
                    window.location.href = "painel.html";
                }, 1000);
            }
        }
    </script>
</body>
</html>
